html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

#homePage{

.home-card{

.home-logo{font-size:80px;line-height:1}

.home-features{margin:30px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.home-feature{padding:18px 12px;border-radius:18px;background:rgba(255,255,255,.07);color:#e9e4f3}
.home-feature strong{display:block;font-size:25px;margin-bottom:6px}

.home-note{margin-top:16px;color:#aaa1ba;font-size:13px}
#appPage{display:none;min-height:100vh}

    "1000000000":"high",

  };

    return {...f,score};
  }).sort((a,b)=>b.score-a.score);

function recommend(){
  const mood=document.getElementById("mood").value;
  const style=document.getElementById("style").value;
  const budget=document.getElementById("budget").value;
  const country=document.getElementById("selectedCountry").value;

  const countryFoods = foods.filter(f=>f.country===country);
  const budgetMap = {
    "1000":"low",
    "10000":"mid",
    "100000":"high",
    "1000000":"high",
    "10000000":"high",
    "100000000":"high",
    "1000000000":"high",
    "etc":"high"
  };
  const budgetTier = budgetMap[budget] || "high";
  const budgetFoods = countryFoods.filter(f=>f.budgets.includes(budgetTier));
  const pool = budgetFoods.length ? budgetFoods : countryFoods;

  let scored=pool.map(f=>{
    let score=0;
    if(f.moods.includes(mood)) score+=3;
    if(f.styles.includes(style)) score+=4;
    if(f.budgets.includes(budgetTier)) score+=5;
    return {...f,score};
  }).sort((a,b)=>b.score-a.score);

  const topScore=scored[0].score;
  const candidates=scored.filter(f=>f.score===topScore);
  const pick=candidates[Math.floor(Math.random()*candidates.length)];

  const budgetNames={"1000":"1,000원","10000":"10,000원","100000":"100,000원","1000000":"1,000,000원","10000000":"10,000,000원","100000000":"100,000,000원","1000000000":"1,000,000,000원","etc":"그 이상"};
  const countryNames={korea:"대한민국",japan:"일본",usa:"미국",italy:"이탈리아",mexico:"멕시코",china:"중국",thailand:"태국",india:"인도",vietnam:"베트남",uk:"영국"};
  document.getElementById("food").textContent=pick.emoji;
  document.getElementById("name").textContent=pick.name + " · " + countryNames[country];
  document.getElementById("reason").textContent=pick.reason + " · 선택 예산: " + budgetNames[budget];
  document.getElementById("tags").innerHTML =
    `<span class="tag">${budget==="low"?"가성비":budget==="mid"?"적당한 가격":"푸짐하게"}</span>
     <span class="tag">${style==="spicy"?"매콤":style==="korean"?"한식":style==="western"?"양식":"간단하게"}</span>
     <span class="tag">오늘의 추천</span>`;

  const alternatives=scored.filter(f=>f.name!==pick.name).slice(0,3).map(f=>f.name).join(" · ");
  document.getElementById("alt").textContent="다른 후보: "+alternatives;
  document.getElementById("result").classList.add("show");
}
