<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Late Night Bites 🌙</title>
<style>
:root{--bg1:#0c0814;--bg2:#211631;--card:rgba(255,255,255,.09);--line:rgba(255,255,255,.15);--muted:#c9c0d8;--accent:#a855f7;--accent2:#ec4899}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;background:radial-gradient(circle at 15% 10%,#39215a 0,transparent 32%),radial-gradient(circle at 85% 90%,#2c193e 0,transparent 28%),linear-gradient(135deg,var(--bg1),var(--bg2) 55%,#08101b)}
button,select{font:inherit}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(980px,100%);border:1px solid var(--line);background:var(--card);backdrop-filter:blur(18px);border-radius:30px;box-shadow:0 28px 100px rgba(0,0,0,.4)}
.home{padding:52px 32px;text-align:center}
.logo{font-size:78px;line-height:1}
h1{font-size:clamp(38px,7vw,68px);line-height:1.02;margin:16px 0 10px;letter-spacing:-.03em}
.sub{max-width:650px;margin:0 auto;color:var(--muted);font-size:18px;line-height:1.65}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:30px 0}
.feature{padding:18px;border-radius:18px;background:rgba(255,255,255,.06)}
.feature b{display:block;font-size:28px;margin-bottom:6px}
.cta,.ghost{width:100%;border:0;border-radius:15px;padding:16px;font-weight:800;cursor:pointer}
.cta{color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 14px 35px rgba(168,85,247,.2)}
.cta:hover{filter:brightness(1.08);transform:translateY(-1px)}
#app{display:none}
.app-card{padding:28px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.topbar h2{margin:0;font-size:28px}
.back{width:auto;padding:10px 14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;border-radius:12px;cursor:pointer}
.filters{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}
.field label{display:block;font-size:13px;color:#d0c7dd;margin:0 0 7px}
select{width:100%;padding:13px 14px;border-radius:13px;border:1px solid #58496f;background:#1a1328;color:#fff;outline:none}
.reco-btn{margin-top:14px}
.result{display:none;margin-top:18px;padding:24px;border-radius:22px;background:#fff;color:#22172c}
.result.show{display:block;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.food-emoji{font-size:58px}
.result h3{font-size:31px;margin:5px 0 8px}
.result p{margin:0 0 14px;color:#665c72;line-height:1.6}
.tags{display:flex;gap:7px;flex-wrap:wrap}
.tag{padding:7px 10px;border-radius:999px;background:#f0e6ff;color:#7034a3;font-size:13px;font-weight:700}
.alt{margin-top:14px;color:#756b82;font-size:14px}
.tip{margin-top:18px;color:#aaa1b6;font-size:13px;text-align:center}
@media(max-width:720px){.home{padding:38px 20px}.feature-grid,.filters{grid-template-columns:1fr}.app-card{padding:20px}.topbar{align-items:flex-start;flex-direction:column}.back{width:100%}}
</style>
</head>
<body>
<section id="home" class="screen">
  <div class="card home">
    <div class="logo">🌙🍜</div>
    <h1>Late Night Bites</h1>
    <p class="sub">나라와 예산, 지금 기분을 고르면 세계 각국의 야식 중에서 하나를 골라드려요.</p>
    <div class="feature-grid">
      <div class="feature"><b>🌎</b>나라별 메뉴</div>
      <div class="feature"><b>💰</b>금액별 추천</div>
      <div class="feature"><b>🎲</b>랜덤 추천</div>
    </div>
    <button class="cta" onclick="startApp()">🍜 야식 추천 시작하기</button>
  </div>
</section>

<section id="app" class="screen">
  <div class="card app-card">
    <div class="topbar"><h2>오늘 밤 뭐 먹지?</h2><button class="back" onclick="goHome()">← 메인으로</button></div>
    <div class="filters">
      <div class="field"><label for="selectedCountry">나라</label><select id="selectedCountry">
        <option value="korea">🇰🇷 대한민국</option><option value="japan">🇯🇵 일본</option><option value="usa">🇺🇸 미국</option><option value="italy">🇮🇹 이탈리아</option><option value="mexico">🇲🇽 멕시코</option><option value="china">🇨🇳 중국</option><option value="thailand">🇹🇭 태국</option><option value="india">🇮🇳 인도</option><option value="vietnam">🇻🇳 베트남</option><option value="uk">🇬🇧 영국</option>
      </select></div>
      <div class="field"><label for="budget">예산</label><select id="budget">
        <option value="1000">1,000원</option><option value="10000">10,000원</option><option value="100000">100,000원</option><option value="1000000">1,000,000원</option><option value="10000000">10,000,000원</option><option value="100000000">100,000,000원</option><option value="1000000000">1,000,000,000원</option><option value="etc">그 이상</option>
      </select></div>
      <div class="field"><label for="mood">지금 기분</label><select id="mood"><option value="hungry">배고파요</option><option value="happy">신나요</option><option value="stress">스트레스 받아요</option><option value="calm">편하게 먹고 싶어요</option></select></div>
    </div>
    <button class="cta reco-btn" onclick="recommend()">🎲 야식 추천받기</button>
    <div id="result" class="result">
      <div id="food" class="food-emoji"></div><h3 id="name"></h3><p id="reason"></p>
      <div id="tags" class="tags"></div><div id="alt" class="alt"></div>
    </div>
    <div class="tip">예산이 높을수록 프리미엄·대용량 메뉴도 후보에 들어갑니다.</div>
  </div>
</section>

const budgetNames={1000:"1,000원",10000:"10,000원",100000:"100,000원",1000000:"1,000,000원",10000000:"10,000,000원",100000000:"100,000,000원",1000000000:"1,000,000,000원",etc:"그 이상"};
const countryNames={korea:"대한민국",japan:"일본",usa:"미국",italy:"이탈리아",mexico:"멕시코",china:"중국",thailand:"태국",india:"인도",vietnam:"베트남",uk:"영국"};
function startApp(){document.getElementById('home').style.display='none';document.getElementById('app').style.display='flex';window.scrollTo(0,0)}
function goHome(){document.getElementById('app').style.display='none';document.getElementById('home').style.display='flex';document.getElementById('result').classList.remove('show')}
function recommend(){
  const country=document.getElementById('selectedCountry').value;
  const budget=document.getElementById('budget').value;
  const mood=document.getElementById('mood').value;
  const tier={1000:'low',10000:'mid',100000:'high',1000000:'high',10000000:'high',100000000:'high',1000000000:'high',etc:'high'}[budget]||'high';
  const cf=foods.filter(f=>f.country===country);
  let pool=cf.filter(f=>f.budgets.includes(tier));
  if(!pool.length) pool=cf;
  const scored=pool.map(f=>{let s=0;if(f.moods.includes(mood))s+=3;if(f.styles.includes('korean')&&mood==='hungry')s+=1;if(f.styles.includes('spicy')&&mood==='stress')s+=1;return{...f,score:s}}).sort((a,b)=>b.score-a.score);
  const top=scored[0]?.score||0;const candidates=scored.filter(f=>f.score===top);const pick=candidates[Math.floor(Math.random()*candidates.length)];if(!pick)return;
  document.getElementById('food').textContent=pick.emoji;document.getElementById('name').textContent=pick.name+' · '+countryNames[country];document.getElementById('reason').textContent=pick.reason+' · 선택 예산: '+budgetNames[budget];
  document.getElementById('tags').innerHTML='<span class="tag">'+budgetNames[budget]+'</span><span class="tag">'+(mood==='stress'?'매운맛 추천':mood==='happy'?'신나는 야식':mood==='calm'?'편안한 메뉴':'든든한 메뉴')+'</span><span class="tag">오늘의 추천</span>';
  document.getElementById('alt').textContent='다른 후보: '+scored.filter(f=>f.name!==pick.name).slice(0,4).map(f=>f.name).join(' · ');
  document.getElementById('result').classList.add('show');
}
